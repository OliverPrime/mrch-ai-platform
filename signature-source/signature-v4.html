<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1060px;height:340px;overflow:hidden;background:transparent}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;display:grid;width:1060px;height:340px;grid-template-columns:400px 1px 320px 291px;align-items:center;gap:0;background:#101012;border-radius:26px;padding:0 0 0 48px;box-shadow:0 30px 70px -30px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.04) inset;overflow:hidden;color:#fff}
.brand{display:flex;flex-direction:column;padding-right:30px;min-width:0}.lockRow{display:flex;align-items:center;gap:20px}.word{height:44px;width:auto;display:block;flex:none}.vRule{width:1px;height:64px;background:rgba(255,255,255,.28);flex:none}.flame{height:48px;width:auto;display:block;flex:none}
.bar{position:relative;display:block;height:5px;width:100%;margin-top:30px;background:rgba(255,255,255,.10);overflow:hidden;border-radius:3px}.fill{position:absolute;inset:0;background-image:linear-gradient(90deg,#C4392A 0%,#DA6F39 24%,#E2A046 40%,#D4AD4E 52%,#A3B454 64%,#71BD5B 78%,#4FBE5C 100%);background-size:100% 100%;clip-path:inset(0 100% 0 0)}.tag{margin:26px 0 0;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.85);font-weight:500;white-space:nowrap;overflow:hidden}
.colRule{width:1px;height:74%;background:rgba(255,255,255,.16);justify-self:center}
.who{display:flex;flex-direction:column;padding:0 28px 0 36px;min-width:0}.name{margin:0;font-size:32px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}.role{margin:3px 0 18px;font-size:14.5px;color:rgba(255,255,255,.62);font-weight:400}
.row{display:flex;align-items:center;gap:14px;padding:9px 0;color:#fff;text-decoration:none}.chip{width:36px;height:36px;flex:none;border-radius:50%;background:#1a1a1e;border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#fff}.val{font-size:15.5px;font-weight:400;color:rgba(255,255,255,.92);letter-spacing:.01em;white-space:nowrap}.hRule{display:block;height:1px;background:rgba(255,255,255,.10)}
.mapWrap{position:relative;align-self:stretch;border-left:1px solid rgba(255,255,255,.06);overflow:hidden}.mapSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.locPill{position:absolute;right:14px;bottom:18px;display:flex;align-items:center;gap:11px;background:rgba(24,24,28,.94);border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:11px 18px 11px 14px;box-shadow:0 10px 26px -12px rgba(0,0,0,.7);pointer-events:none}.locIcon{color:#fff;display:flex}.locTxt{font-size:14px;line-height:1.3;color:#fff;font-weight:400;white-space:nowrap}.in{opacity:0}
