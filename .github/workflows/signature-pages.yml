name: Build MRCH Signature v4
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/mrch-signature-v4.gif'
      - 'public/mrch-signature-v4-preview.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python generate_signature_v4.py
      - name: Commit production Gmail assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/mrch-signature-v4.gif public/mrch-signature-v4-preview.png
          git diff --cached --quiet || git commit -m "Publish MRCH Gmail signature v4 Retina 370"
          git push
