name: Build MRCH Signature
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/mrch-signature.gif'
      - 'public/mrch-signature-preview.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python generate_signature_hq.py
      - name: Commit generated binary assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/mrch-signature.gif public/mrch-signature-preview.png
          git diff --cached --quiet || git commit -m "Build HQ production MRCH signature asset"
          git push
